# Production stack: data services + Spektr app, routed via external Traefik.
# Data services live on spektr-net (internal); MCP joins the Traefik `proxy` network.
#
# Usage:
#   cp .env.example .env.prod  && edit (override hostnames + secrets for prod)
#   task prod:build && task prod:up
#
# Backups: scripts/backup.py shells out to `docker compose run neo4j` and
# archives the CocoIndex LMDB state from the ingest_state volume; service
# names below match.

name: spektr

networks:
  spektr-net:
    driver: bridge
  proxy:
    external: true

volumes:
  qdrant_data:
  neo4j_data:
  # Holds state/ingestion_failures.db and CocoIndex v1's LMDB ledger
  # (COCOINDEX_DB_PATH). Mounted on every service that runs the pipeline.
  ingest_state:
  # Shared between sharepoint-sync (writer) and ingest-live (reader, in
  # LocalFile source mode). Used only when ingesting from SharePoint.
  sharepoint_documents:

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
  image: spektr:latest
  env_file:
    - .env.prod
  networks:
    - spektr-net
  restart: unless-stopped

services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    networks:
      - spektr-net
    # Host-local publish (not on the public interface). Lets scripts/backup.py,
    # scripts/restore.py, and scripts/doctor.py reach the Qdrant HTTP API from
    # the host without opening it to the outside world.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    networks:
      - spektr-net
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  mcp:
    <<: *app-image
    command: ["python", "-m", "server.mcp_server"]
    depends_on:
      - qdrant
      - neo4j
    volumes:
      # Not for pipeline state — the sparse channel encodes the *query* with
      # miniCOIL (retrieval/channels.py -> ingestion.sparse_embedder), so the
      # server downloads the model too. Sharing this volume lets HF_HOME
      # (= /app/state/hf) survive container recreates instead of re-fetching.
      - ingest_state:/app/state
    expose:
      - "8080"
    networks:
      - spektr-net
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy

      # Streaming: disable gzip buffering for SSE / streamable-http
      traefik.http.middlewares.spektr-mcp-streaming.headers.customResponseHeaders.X-Accel-Buffering: "no"
      traefik.http.middlewares.spektr-mcp-streaming.headers.customResponseHeaders.Cache-Control: "no-cache, no-transform"

      # Router
      traefik.http.routers.spektr-mcp.rule: "Host(`${MCP_PUBLIC_DOMAIN:?MCP_PUBLIC_DOMAIN must be set}`) && PathPrefix(`/mcp`)"
      traefik.http.routers.spektr-mcp.entrypoints: websecure
      traefik.http.routers.spektr-mcp.tls: "true"
      traefik.http.routers.spektr-mcp.tls.certresolver: tls_resolver
      traefik.http.routers.spektr-mcp.middlewares: "spektr-mcp-streaming@docker"
      traefik.http.routers.spektr-mcp.service: spektr-mcp

      # Service
      traefik.http.services.spektr-mcp.loadbalancer.server.port: "8080"
      traefik.http.services.spektr-mcp.loadbalancer.responseForwarding.flushInterval: "-1s"

  agent-api:
    <<: *app-image
    command: ["python", "-m", "agent.api"]
    depends_on:
      - mcp
    expose:
      - "8001"

  ingest-live:
    <<: *app-image
    command: ["python", "-m", "ingestion.pipeline", "--live"]
    depends_on:
      - qdrant
      - neo4j
    volumes:
      - ingest_state:/app/state
      # Shared with sharepoint-sync. Ignored when DOCUMENT_SOURCE=s3
      # (the pipeline reads objects straight from the bucket instead).
      - sharepoint_documents:/app/documents

  # Only meaningful when DOCUMENT_SOURCE=sharepoint: the daemon exits 2 on any
  # other source (services/sharepoint_sync/main.py), and `restart:
  # unless-stopped` would turn that into a crash-loop. Gated behind a profile
  # so a plain `up -d` is correct for the local and s3 sources. Start with:
  #   docker compose -f docker-compose.prod.yml --profile sharepoint up -d
  sharepoint-sync:
    <<: *app-image
    command: ["python", "-m", "services.sharepoint_sync"]
    profiles: ["sharepoint"]
    volumes:
      - ingest_state:/app/state
      - sharepoint_documents:/app/documents

  # One-shot batch ingest. Run via:
  #   docker compose -f docker-compose.prod.yml run --rm ingest
  ingest:
    <<: *app-image
    command: ["python", "-m", "ingestion.pipeline"]
    profiles: ["oneshot"]
    depends_on:
      - qdrant
      - neo4j
    volumes:
      - ingest_state:/app/state
      - ./documents:/app/documents:ro

