[project]
name = "spektr"
version = "0.1.0"
description = "RAG-as-MCP-Server: S3 document sync to Qdrant + Neo4j with MCP search tools"
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "cocoindex[amazon-s3,qdrant]>=1.0.18,<2.0",
    "graphiti-core",
    "qdrant-client",
    "neo4j",
    "httpx",
    "fastmcp",
    "openai",
    "pydantic-ai",
    "pydantic-settings",
    "pymupdf",
    "docling",
    "onnxruntime",
    "boto3",
    "uvicorn",
    "fastapi",
    "tenacity",
    "mkdocs-with-pdf>=0.9.3",
    "azure-identity>=1.19,<2",
    "fastembed>=0.7.0",
]

[project.optional-dependencies]
gliner = ["gliner2>=1.2"]
eval = [
    "ragas>=0.2",
    "datasets",
    "langchain-anthropic",
    "langchain-openai",
    "langchain-huggingface",
    "sentence-transformers",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<9.7",
    "respx>=0.21,<1",
    "testcontainers[neo4j]>=4.8",
]

[tool.ruff]
line-length = 95
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
# `scripts/` has no `__init__.py`, so mypy reaches each script by two module
# paths ("backup" and "scripts.backup") and aborts fatally with "Source file
# found twice under different module names" before checking anything else.
# Anchoring the search path at the repo root and deriving module names from it
# gives every file exactly one name.
mypy_path = "."
explicit_package_bases = true
# pymupdf and graphiti-core ship class annotations but leave the methods we
# call unannotated, so every call into them trips `disallow_untyped_calls`.
# Exempting those two packages keeps the check on for calls into our own code.
untyped_calls_exclude = ["pymupdf", "graphiti_core"]

# --- Untyped third-party libraries -------------------------------------------
# No stubs, no py.typed marker. This ignores their *imports* (their symbols
# become `Any`); it relaxes nothing about our own code.
[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "gliner2",
    "gliner2.*",
]
ignore_missing_imports = true

# Optional `eval` extra — `uv sync --extra eval` installs these, a default
# checkout does not, so mypy must not fail on their absence.
[[tool.mypy.overrides]]
module = [
    "ragas.*",
    "datasets",
    "datasets.*",
    "langchain_anthropic",
    "langchain_anthropic.*",
    "langchain_huggingface",
    "langchain_huggingface.*",
    "langchain_openai",
    "langchain_openai.*",
    "ragas",
    "yaml",
]
ignore_missing_imports = true

# --- Test suite --------------------------------------------------------------
# `tests/` is checked, but not under `strict`. Strict typing here was never
# actually enforced: mypy aborted fatally on a module-name collision in
# `scripts/` before it ever reached the suite, so switching it on now is a new
# requirement rather than a regression fix — and ~240 mechanical annotations
# would bury unrelated work. Production packages stay strict. `ignore_errors`
# is deliberately NOT used: annotated test helpers are still fully checked.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_unused_ignores = false
# What is left after dropping strict is the test suite reaching into things
# the type system cannot see. Every one of these needs an edit inside
# `tests/`, so they are suppressed here rather than left red:
#   union-attr (67) — asserting on the internals of qdrant's `Filter.must`
#     union and neo4j's `Record | None`. Narrowing every one at the call site
#     would be ~67 asserts that test the type checker, not the code.
#   attr-defined (23) — `LogRecord` extras, private engine attrs,
#     monkeypatched module globals. Unreachable by annotation.
#   call-arg (10) — `Settings(_env_file=...)`, a pydantic-settings kwarg mypy
#     cannot see without the pydantic plugin.
#   type-arg (5) — bare `dict`/`list` in helper signatures.
# The list is deliberately SHORT. arg-type, index, misc, no-any-return,
# return-value and list-item were also failing (15 in total) and were fixed at
# the source instead, because those are the codes that catch a genuinely wrong
# test rather than a limit of the type system.
# This is not `ignore_errors`: name resolution, redefinitions, bad
# assignments, unreachable code and import errors are still caught in tests/.
disable_error_code = [
    "attr-defined",
    "call-arg",
    "type-arg",
    "union-attr",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration and not eval'"
testpaths = ["tests"]
markers = [
    "integration: tests requiring Docker services",
    "eval: RAGAS retrieval-quality tests (slow, needs LLM + ingested corpus)",
]
