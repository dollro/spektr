[project]
name = "spektr"
version = "0.1.0"
description = "RAG-as-MCP-Server: S3 document sync to Qdrant + Neo4j with MCP search tools"
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "cocoindex",
    "graphiti-core",
    "qdrant-client",
    "neo4j",
    "httpx",
    "fastmcp",
    "openai",
    "pydantic-ai",
    "pydantic-settings",
    "pymupdf",
    "docling",
    "onnxruntime",
    "boto3",
    "uvicorn",
    "fastapi",
    "tenacity",
    "mkdocs-with-pdf>=0.9.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<9.7",
]

[tool.ruff]
line-length = 95
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: tests requiring Docker services",
]
